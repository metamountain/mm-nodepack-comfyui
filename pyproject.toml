[project]
name = "mm-nodepack-comfyui"
description = "Four minimal, unified ComfyUI V3 nodes: Load Image MM, Preview Image MM, Upscale Crop MM, and LLM Multitool MM."
version = "0.2.0"
license = { file = "LICENSE" }
dependencies = []

[project.urls]
Repository = "https://github.com/metamountain/mm-nodepack-comfyui"

[tool.comfy]
PublisherId = "metamountain"
DisplayName = "MM Nodepack"
Icon = "https://raw.githubusercontent.com/metamountain/mm-nodepack-comfyui/main/assets/logo.svg"
includes = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
